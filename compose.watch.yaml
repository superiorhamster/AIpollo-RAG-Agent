x-watch-common:
  shared-sync: &shared-sync
    action: sync+restart
    path: ./services/shared
    target: /app/shared
    ignore:
      - "**/__pycache__/**"
  services-dockerfile-rebuild: &services-dockerfile-rebuild
    action: rebuild
    path: ./services/Dockerfile

services:
  api-gateway:
    develop:
      watch:
        - action: sync+restart
          path: ./services/api-gateway/app
          target: /app/app
          ignore:
            - "**/__pycache__/**"
            - "**/migrations/**"
        - *shared-sync
        - action: rebuild
          path: ./services/api-gateway/pyproject.toml
        - action: rebuild
          path: ./services/api-gateway/uv.lock
        - *services-dockerfile-rebuild

  auth-service:
    develop:
      watch:
